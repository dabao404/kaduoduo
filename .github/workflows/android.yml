name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Android cmdline-tools
        run: |
          mkdir -p ${{ runner.temp }}/sdk/cmdline-tools
          cd ${{ runner.temp }}
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d sdk/cmdline-tools
          mv sdk/cmdline-tools/cmdline-tools sdk/cmdline-tools/latest

      - name: Install Android SDK platform
        run: |
          SDK=${{ runner.temp }}/sdk
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true clean assembleDebug
        env:
          ANDROID_HOME: ${{ runner.temp }}/sdk
